name: Update contribution snake

on:
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile source
        uses: actions/checkout@v4

      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish generated assets to orphan output branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/profile-output
          cp dist/github-snake.svg /tmp/profile-output/github-snake.svg
          cp dist/github-snake-dark.svg /tmp/profile-output/github-snake-dark.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin output:refs/remotes/origin/output || true
          git branch -D output 2>/dev/null || true
          git checkout --orphan output
          git rm -rf . 2>/dev/null || true
          cp /tmp/profile-output/*.svg .
          git add github-snake.svg github-snake-dark.svg
          git commit -m "chore: update contribution snake"
          git push --force origin output
