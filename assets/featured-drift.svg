<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description" width="1200" height="420" preserveAspectRatio="xMidYMid meet">
  <title id="title">Drift — Some words are meant to drift</title>
  <desc id="description">An illustrated glass bottle carrying a folded note across a quiet blue sea. A cover illustration, not an application screenshot.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#faf8f1"/><stop offset="1" stop-color="#eaf1ee"/></linearGradient>
    <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#719eaa"/><stop offset="1" stop-color="#244e63"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="0"><stop stop-color="#f4ffff" stop-opacity=".5"/><stop offset=".5" stop-color="#e5f5f3" stop-opacity=".2"/><stop offset="1" stop-color="#f5ffff" stop-opacity=".65"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="360" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
