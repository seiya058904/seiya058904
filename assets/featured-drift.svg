    <g fill="#204754">
      <text x="66" y="69" font-family="Arial, sans-serif" font-size="13" letter-spacing="3">A QUIET MOMENT OF CONNECTION</text>
      <text x="61" y="177" font-family="Georgia, serif" font-size="102">Drift</text>
      <text x="66" y="224" font-family="Georgia, serif" font-size="27" font-style="italic">Some words are meant to drift.</text>
      <path d="M66 255h70" stroke="#8aa5a7" stroke-width="2"/>
      <text x="66" y="291" font-family="Arial, sans-serif" font-size="17">Leave a thought. Open a stranger’s bottle.</text>
      <text x="66" y="324" font-family="Arial, sans-serif" font-size="12" letter-spacing="2" fill="#537078">ANONYMOUS · NO ACCOUNTS · NO READ RECEIPTS</text>
