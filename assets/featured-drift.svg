    <path d="M748 337Q877 307 1020 323T1220 300" fill="none" stroke="#e3f1eb" stroke-width="1.5" opacity=".5"/>
    <path d="M827 233q49-12 92 0m99-14q38-8 65-4" fill="none" stroke="#f4f5e9" stroke-width="2" opacity=".7"/>
