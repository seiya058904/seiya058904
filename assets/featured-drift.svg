      <rect x="-25" y="-91" width="50" height="23" rx="4" fill="#b28b5e" stroke="#8f704b" stroke-width="1.5"/>
      <path d="M-15-84h29M-15-77H8" stroke="#d8bb8a" stroke-width="2"/>
      <rect x="-30" y="7" width="61" height="70" rx="3" fill="#f9f0d6"/>
